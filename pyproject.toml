[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tempmailc"
version = "1.0.1"
description = "Official Python SDK for TempMailAPI (https://private.tempmailc.com). Instant OTP extraction, real-time SSE streaming, and Kopeechka 2.0 compatibility."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "TempMailAPI", email = "support@tempmailc.com" }
]
keywords = ["tempmail", "disposable-email", "otp", "temporary-email", "kopeechka", "automation", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "requests>=2.25.0"
]

[project.optional-dependencies]
async = ["httpx>=0.23.0"]

[project.urls]
Homepage = "https://private.tempmailc.com"
Documentation = "https://private.tempmailc.com/docs"
Repository = "https://github.com/tempmailapi/tempmail-api-python"
